apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dfd-postgresql
  labels:
    app: dfd
    component: postgresql
spec:
  serviceName: dfd-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: dfd
      component: postgresql
  template:
    metadata:
      labels:
        app: dfd
        component: postgresql
    spec:
      containers:
        - name: postgresql
          # Requires Red Hat subscription; community alternative: docker.io/postgres:16
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: dfd-database
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dfd-database
                  key: password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: dfd-database
                  key: database
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dfd-postgresql-data
