apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dfd-postgresql-data
  labels:
    app: dfd
    component: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  # AWS-specific; adjust for your cluster (e.g. standard, managed-premium)
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 10Gi
